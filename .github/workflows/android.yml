# Baut bei jedem Push auf main eine neue APK und veröffentlicht sie als GitHub-Release.
name: Android-APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Eisenbuch-App für die Garmin-Uhr (Connect IQ). Braucht die Secrets GARMIN_USERNAME und GARMIN_PASSWORD
  # für die Gerätedaten der Venu 3. Ohne Secrets wird der Schritt übersprungen, die APK entsteht trotzdem.
  watch:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Uhr-App bauen
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::notice title=Uhr-App übersprungen::Secrets GARMIN_USERNAME und GARMIN_PASSWORD fehlen."
            exit 0
          fi
          set -o pipefail
          mkdir -p "$HOME/bin"; export PATH="$HOME/bin:$PATH"
          curl -sSfL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh -s -- -b "$HOME/bin"
          connect-iq-sdk-manager agreement accept
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set '^8.0.0' || connect-iq-sdk-manager sdk set '^7.0.0'
          export PATH="$(connect-iq-sdk-manager sdk current-path --bin):$PATH"
          connect-iq-sdk-manager device download --manifest=watch/manifest.xml
          ok=1
          for d in venu3 venu3s; do
            if ! monkeyc -d $d -f watch/monkey.jungle -y watch/developer_key.der -l 0 -w -o eisenbuch-uhr-$d.prg 2>&1 | tee monkeyc-$d.log; then ok=0; fi
          done
          if [ $ok = 0 ]; then
            msg=$(grep -iE "error|ERROR" monkeyc-*.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Uhr-App Compilerfehler::$msg"
            exit 1
          fi
          ls -la *.prg
      - uses: actions/upload-artifact@v4
        with:
          name: eisenbuch-uhr
          path: eisenbuch-uhr-*.prg
          if-no-files-found: ignore
  build:
    needs: watch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Logik-Tests
        run: npm test
      - name: Web-Teil bauen und ins Android-Projekt kopieren
        run: npm run build:web && npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log; then
            # Fehlerursache als Annotation ausgeben, damit sie ohne Log-Download lesbar ist
            msg=$(grep -A25 -E "What went wrong|error:|e: " ../gradle.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle-Fehler::$msg"
            exit 1
          fi
      - name: APK benennen
        run: cp android/app/build/outputs/apk/release/app-release.apk eisenbuch-1.${{ github.run_number }}.apk
      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Starttest im Android-Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator-smoke.sh eisenbuch-1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eisenbuch-apk
          path: |
            eisenbuch-1.${{ github.run_number }}.apk
            emulator-start.png
            logcat.txt
          if-no-files-found: ignore
      - name: Uhr-App holen (falls gebaut)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: eisenbuch-uhr
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Eisenbuch 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            eisenbuch-1.${{ github.run_number }}.apk
            emulator-start.png
            eisenbuch-uhr-*.prg
          make_latest: true
